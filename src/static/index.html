<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Fact Detection System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="container glass-panel">
        <div id="session-bar" style="display:flex;align-items:center;justify-content:space-between;
             gap:12px;flex-wrap:wrap;padding:10px 14px;margin-bottom:22px;border-radius:12px;
             background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.35);font-size:.85rem">
            <span style="color:var(--text-secondary)">
                Sesión autorizada · quedan
                <strong id="session-countdown" style="color:#fff;font-variant-numeric:tabular-nums">--:--</strong>
            </span>
            <button type="button" id="btn-logout"
                    style="background:transparent;border:1px solid var(--panel-border);color:var(--text-secondary);
                           border-radius:8px;padding:6px 12px;font-family:inherit;font-size:.8rem;cursor:pointer">
                Salir
            </button>
        </div>

        <header>
            <h1>Fact<span>X</span> Agent</h1>
            <p>AI-Powered Audio Extraction & Fact Checking Ecosystem</p>
        </header>

        <main>
            <!-- Input Type Switcher -->
            <div class="tab-switcher">
                <button class="tab-btn active" data-tab="url-tab">🔗 Media URL</button>
                <button class="tab-btn" data-tab="file-tab">📁 Upload File</button>
                <button class="tab-btn" data-tab="record-tab">🎤 Record Audio</button>
            </div>

            <!-- Forms -->
            <form id="ingestion-form">
                
                <div id="url-tab" class="input-section active">
                    <input type="url" id="media-url" placeholder="Paste YouTube, TikTok or Media URL here..." autocomplete="off">
                </div>

                <div id="file-tab" class="input-section">
                    <div class="file-upload-wrapper">
                        <input type="file" id="media-file" accept="audio/*,video/*">
                        <div class="file-upload-visuals">
                            <span class="upload-icon">⬆️</span>
                            <span id="file-name-display">Click or drag an Audio/Video file</span>
                        </div>
                    </div>
                </div>

                <div id="record-tab" class="input-section">
                    <div class="record-wrapper" style="text-align: center; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--panel-border);">
                        <button type="button" id="btn-record" class="btn btn-secondary" style="border-radius: 50px; padding: 15px 30px; font-size: 1.2rem; display: inline-flex; align-items: center; gap: 10px; margin-bottom: 15px; border: 2px solid transparent; transition: all 0.3s;">
                            <span id="record-icon">🔴</span>
                            <span id="record-text">Start Recording</span>
                        </button>
                        <div id="record-status" style="color: var(--text-secondary); margin-bottom: 15px; font-size: 0.95rem;">Microphone ready</div>
                        <audio id="audio-playback" controls style="display: none; margin: 0 auto; width: 100%; max-width: 400px; outline: none; border-radius: 8px;"></audio>
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn btn-secondary" id="btn-transcribe">
                        <span>📝 Transcribe Only</span>
                    </button>
                    <button type="button" class="btn btn-primary" id="btn-factcheck">
                        <span>🕵️ Full Fact Check</span>
                        <div class="btn-glow"></div>
                    </button>
                </div>
            </form>

            <!-- Loading State -->
            <div id="loading-state" class="hidden">
                <div class="spinner"></div>
                <p id="loading-text">Agents are analyzing the media...</p>
            </div>

            <!-- Results Section -->
            <div id="results-section" class="hidden">
                <div class="results-header">
                    <h2>Analysis Results</h2>
                </div>
                
                <div class="transcript-box">
                    <h3>Raw Transcript</h3>
                    <div id="transcript-content" class="content-scroll"></div>
                </div>

                <div id="facts-container" class="hidden">
                    <h3>Fact Checking Evaluation</h3>
                    <div id="facts-list"></div>
                </div>
            </div>

        </main>
    </div>

    <script src="/static/app.js?v=3"></script>
</body>
</html>
